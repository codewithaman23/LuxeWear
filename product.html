<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product — NOIR</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><div class="announcement">Complimentary shipping on orders over ₹1,500 <span>•</span> Easy 7-day returns</div><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">N</span><span>NOIR</span></a><button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false">☰</button><nav class="main-nav"><a href="index.html">Home</a><a href="streetwear.html">Shop</a><a href="streetwear.html?category=tshirts">T-shirts</a><a href="streetwear.html?category=hoodies">Hoodies</a></nav><div class="header-actions"><a href="login.html" class="text-action">Account</a><a href="wishlist.html" class="icon-action">♡<b data-wishlist-count>0</b></a><a href="cart.html" class="icon-action">Bag <b data-cart-count>0</b></a></div></header><main class="product-detail section" data-product-detail></main><footer class="site-footer"><div class="brand"><span class="brand-mark">N</span><span>NOIR</span></div><p>© 2026 NOIR. Made for everyday.</p></footer><script src="js/app.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{const product=products.find(item=>item.id===new URLSearchParams(location.search).get("id"))||products[0];const discount=Math.round((1-product.price/product.oldPrice)*100);document.title=`${product.name} — NOIR`;document.querySelector("[data-product-detail]").innerHTML=`<a class="under-link product-back" href="streetwear.html">← Back to shop</a><div class="detail-layout"><div class="detail-image"><img src="${product.image}" alt="${product.name}"></div><div class="detail-copy"><p class="eyebrow">${product.category} / ${product.colour}</p><h1>${product.name}</h1><div class="product-meta"><span class="price">${money(product.price)}</span><span class="old-price">${money(product.oldPrice)}</span><span class="discount">${discount}% off</span></div><p class="detail-description">A relaxed everyday essential made for repeat wear. Easy proportions, considered details, and a finish that gets better with time.</p><div class="size-picker"><strong>Choose your size</strong><div><button type="button" class="size-option is-selected">S</button><button type="button" class="size-option">M</button><button type="button" class="size-option">L</button><button type="button" class="size-option">XL</button></div></div><button class="button button-dark detail-add" data-add="${product.id}">Add to bag <span>→</span></button><p class="detail-note">Complimentary shipping over ₹1,500 · 7-day easy returns</p></div></div>`;document.querySelectorAll(".size-option").forEach(button=>button.addEventListener("click",()=>{document.querySelectorAll(".size-option").forEach(item=>item.classList.remove("is-selected"));button.classList.add("is-selected")}))});</script></body></html>
