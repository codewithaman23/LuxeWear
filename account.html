<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account — NOIR</title><link rel="stylesheet" href="style.css"></head><body class="page-simple"><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">N</span><span>NOIR</span></a><nav class="main-nav"><a href="streetwear.html">Shop</a><a href="wishlist.html">Wishlist</a><a href="cart.html">Bag</a></nav></header><main class="simple-main"><p class="eyebrow">Your NOIR</p><h1 data-account-name>Account</h1><p data-account-email></p><button class="button button-dark" data-logout type="button">Sign out <span>→</span></button></main><script src="js/guard.js"></script><script>fetch("/api/auth/me").then(response=>response.json()).then(({user})=>{document.querySelector("[data-account-name]").textContent=`Hello, ${user.name}`;document.querySelector("[data-account-email]").textContent=user.email});document.querySelector("[data-logout]").addEventListener("click",async()=>{await fetch("/api/auth/logout",{method:"POST"});location.href="index.html"});</script></body></html>
