<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — NOIR</title><link rel="stylesheet" href="auth.css"></head><body class="auth-page"><main class="auth-card"><a class="brand" href="index.html"><span class="brand-mark">N</span><span>NOIR</span></a><div class="auth-heading"><p class="eyebrow">Welcome back</p><h1>Good to see<br><em>you again.</em></h1><p>Sign in to manage your orders and saved pieces.</p></div><div class="auth-alert" data-auth-alert role="alert"></div><div class="auth-tabs"><button class="is-active" data-auth-tab="password" type="button">Password</button><button data-auth-tab="otp" type="button">Email</button></div><form data-auth-form="password" class="auth-form"><label>Email address<input required type="email" name="email" autocomplete="email"></label><label>Password<input required minlength="8" type="password" name="password" autocomplete="current-password"></label><button class="button button-dark" type="submit">Sign in <span>→</span></button></form><form data-auth-form="otp" class="auth-form" hidden><label>Email address<input required type="email" name="email" autocomplete="email"></label><button class="button button-dark" data-otp-send type="submit">Send verification code <span>→</span></button><label hidden data-otp-field>Verification code<input inputmode="numeric" pattern="[0-9]{6}" maxlength="6" name="code"></label><button hidden class="button button-dark" data-otp-verify type="button">Verify & sign in <span>→</span></button></form><p class="auth-footer">New to NOIR? <a href="signup.html">Create an account</a></p><a class="auth-home" href="index.html">← Back to home</a></main><script src="js/auth.js"></script></body></html>
