<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — NOIR</title><link rel="stylesheet" href="style.css"></head><body class="page-simple"><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">N</span><span>NOIR</span></a><nav class="main-nav"><a href="streetwear.html">Continue shopping</a></nav></header><main class="checkout-layout simple-main"><section><p class="eyebrow">Almost there</p><h1>Checkout</h1><form class="checkout-form" data-checkout-form><label>Full name<input required name="name" autocomplete="name"></label><label>Email address<input required type="email" name="email" autocomplete="email"></label><label>Delivery address<input required name="address" autocomplete="street-address"></label><div class="form-grid"><label>City<input required name="city" autocomplete="address-level2"></label><label>PIN code<input required pattern="[0-9]{6}" name="pin" inputmode="numeric" autocomplete="postal-code"></label></div><button class="button button-dark" type="submit">Place order <span>→</span></button></form></section><aside class="checkout-aside"><p class="eyebrow">Order summary</p><div data-checkout-summary></div></aside></main><script src="js/guard.js"></script><script src="js/app.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{const cart=JSON.parse(localStorage.getItem("noir-cart")||"[]");const summary=document.querySelector("[data-checkout-summary]");const subtotal=cart.reduce((sum,item)=>sum+products.find(product=>product.id===item.id).price*item.quantity,0);summary.innerHTML=cart.map(item=>{const product=products.find(entry=>entry.id===item.id);return`<div class="summary-line"><span>${product.name} × ${item.quantity}</span><strong>${money(product.price*item.quantity)}</strong></div>`}).join("")+`<div class="summary-line total"><span>Total</span><strong>${money(subtotal)}</strong></div>`;document.querySelector("[data-checkout-form]").addEventListener("submit",event=>{event.preventDefault();localStorage.setItem("noir-last-order",JSON.stringify({total:subtotal,number:"NOIR-"+Date.now().toString().slice(-6)}));localStorage.removeItem("noir-cart");location.href="order-success.html"})});</script></body></html>
